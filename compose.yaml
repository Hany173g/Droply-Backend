services:

  app:
    build: .
    container_name: droply
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
        mongodb:
          condition: service_healthy
        redis:
          condition: service_healthy

  mongodb:
    image: mongo
    container_name: mongodb
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5  

  redis:
    image: redis:7
    container_name: redis
    healthcheck:
      test: ["CMD", "redis-cli","ping"]
      interval: 5s
      timeout: 5s
      retries: 5 
volumes:
  mongo-data: